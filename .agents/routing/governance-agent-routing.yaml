  - path_prefix: scripts/generate_typed_evidence_results_index.py
    agents: [evidence-and-intake, demo-readiness]
  - path_prefix: scripts/lib/result_ledger.py
    agents: [evidence-and-intake, governance-analyst, release-manager]
  - path_prefix: scripts/lib/governance_lifecycle/
    agents: [evidence-and-intake, governance-analyst, release-manager]
  - path_prefix: model/governance/lifecycle/
    agents: [evidence-and-intake, governance-analyst, release-manager]
  - path_prefix: scripts/serve_governance_workbench.py
    agents: [evidence-and-intake, governance-analyst]
  - path_prefix: scripts/start_governance_workbench.sh
    agents: [evidence-and-intake, governance-analyst]
  - path_prefix: scripts/workbench/
    agents: [evidence-and-intake, governance-analyst]
  - path_prefix: docs/operations/agents/
    agents: [governance-analyst]
  - path_prefix: .agents/routing/
