# Bamboo YAML Specs v2; prepared agent, real application/scanner output required.
version: 2
plan:
  project-key: GOV
  key: PORT
  name: Portable AXIOM Pipeline L1 Candidate
variables:
  axiom.runtime: /opt/axiom/runtime
  axiom.python: /opt/axiom/venv/bin/python
  axiom.opa: /opt/axiom/venv/bin/opa
  axiom.profile: /etc/axiom/consumer.json
  axiom.mode: report-only
stages:
  - Governance:
      jobs:
        - Evaluate portable pipeline
Evaluate portable pipeline:
  tasks:
    - checkout:
        force-clean-build: true
    - script:
        interpreter: SHELL
        description: Run the application's real build and scanners
        scripts:
          - ./ci/build-and-scan.sh
    - script:
        interpreter: SHELL
        description: Run the shared versioned evaluator and gate
        scripts:
          - |
            set -eu
            "${bamboo_axiom_python}" "${bamboo_axiom_runtime}/scripts/governance_runtime.py" run \
              --ci bamboo --profile "${bamboo_axiom_profile}" --checkout . \
              --artifact dist/application-source.tar.gz --sbom security/sbom.cyclonedx.json \
              --scan security/vulnerability-scan.json --output-directory portable-evidence \
              --mode "${bamboo_axiom_mode}" --opa "${bamboo_axiom_opa}"
  final-tasks:
    - script:
        interpreter: SHELL
        description: Preserve a diagnostic when execution did not start
        scripts:
          - |
            mkdir -p portable-evidence
            if [ ! -f portable-evidence/result.json ] && [ ! -f portable-evidence/diagnostics.json ]; then
              printf '%s\n' '{"schema_version":"1.0.0","execution":"error","diagnostics":["runtime_did_not_produce_result"]}' > portable-evidence/diagnostics.json
            fi
    - script:
        interpreter: SHELL
        description: Export complete versioned bundle when a result exists
        scripts:
          - |
            if [ -f portable-evidence/result.json ]; then
              "${bamboo_axiom_python}" "${bamboo_axiom_runtime}/scripts/intake_portable_evidence.py" bundle \
                --assessment portable-evidence --checkout . --destination portable-bundle
            fi
  artifacts:
    - name: axiom-portable-bundle-v2
      location: .
      pattern: portable-bundle.zip
      shared: true
      required: false
    - name: axiom-portable-pipeline-l1
      location: portable-evidence
      pattern: "*.json"
      shared: true
      required: true
    - name: application-artifact
      location: dist
      pattern: application-source.tar.gz
      shared: true
      required: true
    - name: security-evidence
      location: security
      pattern: "*.json"
      shared: true
      required: true
