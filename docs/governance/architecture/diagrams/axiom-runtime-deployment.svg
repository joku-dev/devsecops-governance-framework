<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1415 820" role="img" aria-labelledby="title desc">
<title id="title">AXIOM runtime deployment</title><desc id="desc">Reviewed Git source is used independently on the Mac, Ubuntu VM and GitHub Actions. Workbenches have private per-host drafts and keys. The VM has a systemd Workbench and bounded collector units; the legacy engine remains selected. Accepted Git history publishes static Pages. Ansible updates the exact VM revision with two-location verified backups.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#385a7c"/></marker></defs>
<rect width="1415" height="820" fill="#f6f8fc"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17344f}.title{font-size:24px;font-weight:700}.subtitle{font-size:15px;fill:#425b70}.label{font-size:17px;font-weight:700}.body{font-size:15px}.edge{fill:none;stroke:#385a7c;stroke-width:2;marker-end:url(#arrow)}.box{fill:white;stroke:#597b9b;stroke-width:1.5;rx:10}.core{fill:#e8f2fd}.private{fill:#fff4db}.public{fill:#e7f5ed}</style>
<text x="35" y="36" class="title">AXIOM — runtime deployment</text>
<text x="35" y="65" class="subtitle">Independent hosts share reviewed source and evaluator contracts; private state is not synchronized automatically.</text>
<rect x="510" y="95" width="395" height="85" class="box "/>
<text x="528" y="124" class="label">Reviewed Git source</text>
<text x="528" y="150" class="body">Exact runtime commit + frozen baseline</text>
<rect x="35" y="235" width="395" height="460" rx="14" fill="#edf2f8" stroke="#9eb2c6"/>
<text x="53" y="268" class="label">macOS maintainer host</text>
<rect x="510" y="235" width="395" height="460" rx="14" fill="#edf2f8" stroke="#9eb2c6"/>
<text x="528" y="268" class="label">Ubuntu VM</text>
<rect x="985" y="235" width="395" height="460" rx="14" fill="#edf2f8" stroke="#9eb2c6"/>
<text x="1003" y="268" class="label">Central GitHub Actions / Pages</text>
<rect x="55" y="295" width="355" height="80" class="box core"/>
<text x="73" y="324" class="label">Private Workbench</text>
<text x="73" y="350" class="body">Loopback :8765; per-port session</text>
<rect x="55" y="400" width="355" height="80" class="box "/>
<text x="73" y="429" class="label">Explicit CLI / controller</text>
<text x="73" y="455" class="body">Python + OPA; Ansible / SSH</text>
<rect x="55" y="520" width="355" height="95" class="box private"/>
<text x="73" y="549" class="label">Private Mac state</text>
<text x="73" y="575" class="body">Saved drafts, keys and sessions</text>
<rect x="530" y="295" width="355" height="80" class="box core"/>
<text x="548" y="324" class="label">Workbench under systemd</text>
<text x="548" y="350" class="body">Loopback :8766 via SSH tunnel</text>
<rect x="530" y="400" width="355" height="95" class="box "/>
<text x="548" y="429" class="label">Bounded collector units</text>
<text x="548" y="455" class="body">Legacy selected; portable available</text>
<text x="548" y="478" class="body">Credentials / activation separate</text>
<rect x="530" y="535" width="355" height="100" class="box private"/>
<text x="548" y="564" class="label">Private VM state</text>
<text x="548" y="590" class="body">Drafts; optional SQLite / raw data</text>
<text x="548" y="613" class="body">Verified VM + controller backups</text>
<rect x="1005" y="295" width="355" height="95" class="box "/>
<text x="1023" y="324" class="label">Short-lived CI jobs</text>
<text x="1023" y="350" class="body">Validation, accepted intake,</text>
<text x="1023" y="373" class="body">reviewed proposals and generation</text>
<rect x="1005" y="475" width="355" height="95" class="box public"/>
<text x="1023" y="504" class="label">Static public publication</text>
<text x="1023" y="530" class="body">MkDocs and read-only Viewer</text>
<text x="1023" y="553" class="body">No private Workbench / queue API</text>
