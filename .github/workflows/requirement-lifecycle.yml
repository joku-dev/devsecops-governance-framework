name: Requirement Lifecycle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "model/requirements/**"
      - "schemas/*requirement*.json"
      - "scripts/manage_requirement_lifecycle.py"
      - "scripts/validate_requirement_lifecycle.py"
      - "scripts/generate_implemented_requirement_migration.py"
      - "scripts/lib/requirement_lifecycle.py"
      - "docs/governance/requirements/**"
      - "docs/publishing/governance-requirement-catalog/**"
      - "generated/reports/implemented-requirement-migration.*"
      - "doc-as-code/**"
      - ".github/workflows/requirement-lifecycle.yml"
  push:
    branches: [main]
    paths:
      - "model/requirements/**"
      - "schemas/*requirement*.json"
      - "scripts/manage_requirement_lifecycle.py"
      - "scripts/validate_requirement_lifecycle.py"
      - "scripts/generate_implemented_requirement_migration.py"
      - "scripts/lib/requirement_lifecycle.py"
      - "docs/governance/requirements/**"
      - "docs/publishing/governance-requirement-catalog/**"
      - "generated/reports/implemented-requirement-migration.*"
      - "doc-as-code/**"
      - ".github/workflows/requirement-lifecycle.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-validation.txt
      - name: Validate requirement lifecycle
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python scripts/manage_requirement_lifecycle.py generate-publication
          python scripts/generate_implemented_requirement_migration.py
          git diff --exit-code -- docs/publishing/governance-requirement-catalog/
          git diff --exit-code -- generated/reports/implemented-requirement-migration.json generated/reports/implemented-requirement-migration.md
          if [ -n "$BASE_REF" ] && git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
            python scripts/validate_requirement_lifecycle.py --base-ref "$BASE_REF"
          else
            python scripts/validate_requirement_lifecycle.py
          fi
          python doc-as-code/scripts/build_publication.py --validate-only --manifest docs/publishing/governance-requirement-catalog/publication.yaml
      - name: Run requirement lifecycle tests
        run: python -m unittest tests.test_requirement_lifecycle tests.test_requirement_artifact_register
      - name: Summarize review state
        run: python scripts/manage_requirement_lifecycle.py report >> "$GITHUB_STEP_SUMMARY"
      - name: Build catalog HTML, Word, and PDF preview
        uses: ./doc-as-code
        with:
          manifest: docs/publishing/governance-requirement-catalog/publication.yaml
          output: build/governance-requirement-catalog
      - name: Upload catalog publication preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-requirement-catalog-${{ github.sha }}
          path: build/governance-requirement-catalog/
          if-no-files-found: error
          retention-days: 14
