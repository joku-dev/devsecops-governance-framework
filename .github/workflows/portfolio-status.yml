name: Refresh Portfolio Onboarding Status

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # Dispatch required checks for GITHUB_TOKEN-created PRs.

concurrency:
  group: portfolio-status
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out governance repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-validation.lock

      - name: Install validation dependencies
        run: python -m pip install --require-hashes -r requirements-validation.lock

      - name: Regenerate portfolio status
        run: python3 scripts/generate_portfolio_onboarding_status.py

      # This maintenance workflow validates only the projection it regenerates.
      # Full repository validation remains enforced by governance-ci.yml.
      - name: Validate portfolio status
        run: python3 -m unittest discover -s tests -p "test_portfolio_onboarding_status.py"

      - name: Open operational review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_operational_update.py --scope portfolio
