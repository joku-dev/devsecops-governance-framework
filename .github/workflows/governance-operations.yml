name: Daily Governance Operations

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/governance-operations.yml"
      - ".github/operations-report.json"
      - "scripts/generate_operations_report.py"
      - "scripts/assess_governance_repository_security.py"
      - "scripts/generate_intake_health.py"
      - "schemas/governance-operations-report.schema.json"
      - "tests/test_operations_report.py"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: governance-operations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    name: Daily Operations Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out report implementation and accepted data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-validation.lock

      - name: Install validation dependencies
        run: python -m pip install --require-hashes -r requirements-validation.lock

      - name: Test report semantics
        run: python -m unittest discover -s tests -p test_operations_report.py

      - name: Collect and validate daily operations report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_operations_report.py

      - name: Publish operations summary
        env:
          REPORT_EVENT: ${{ github.event_name }}
        run: |
          if [ "$REPORT_EVENT" = "pull_request" ]; then
            echo '**PR preview — proposed checkout, not the scheduled main observation.**' >> "$GITHUB_STEP_SUMMARY"
          fi
          cat generated/reports/operations/governance-operations.md >> "$GITHUB_STEP_SUMMARY"

      - name: Retain report and observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: governance-operations
          path: generated/reports/operations/
          retention-days: 30
          if-no-files-found: error
