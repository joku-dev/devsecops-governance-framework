name: Publish Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "generated/viewer/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "requirements-docs.lock"
      - "requirements-validation.lock"
      - "scripts/generate_status_viewer.py"
      - "scripts/lib/viewer_app.py"
      - "scripts/lib/viewer_technical.py"
      - "scripts/lib/viewer_experience.py"
      - "scripts/lib/consumer_lifecycle_next_step.py"
      - "scripts/lib/measured_security*.py"
      - "scripts/lib/measured_l1.py"
      - "schemas/measured-l1-assessment.schema.json"
      - "apps/governance-viewer/**"
      - "scripts/generate_governance_graph.py"
      - "doc-as-code/**"
      - "generated/graph/**"
      - "status/**"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish-docs:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse publication of confidential research
        run: |
          if [ -f experiments/state_binding/CONFIDENTIAL ]; then
            echo "Confidential research marker prevents public publication." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.18.2

      - name: Install MkDocs
        run: |
          python -m pip install --require-hashes -r requirements-docs.lock

      - name: Generate governance viewer artifacts
        run: |
          python3 scripts/generate_governance_graph.py
          python3 scripts/generate_status_viewer.py

      - name: Build Git-authored publication exports
        uses: ./doc-as-code

      - name: Build docs site
        run: |
          mkdocs build --strict
          mkdir -p site/generated
          cp -R generated/. site/generated/
          mkdir -p site/downloads/doc-as-code
          cp build/doc-as-code/doc-as-code-pilot-001.html site/downloads/doc-as-code/
          cp build/doc-as-code/doc-as-code-pilot-001.docx site/downloads/doc-as-code/
          cp build/doc-as-code/doc-as-code-pilot-001.pdf site/downloads/doc-as-code/
          cp build/doc-as-code/publication-provenance.json site/downloads/doc-as-code/
          cp build/doc-as-code/requirements-index.json site/downloads/doc-as-code/
          cp build/doc-as-code/doc-as-code.css site/downloads/doc-as-code/
          python3 - <<'PY'
          from pathlib import Path

          page = Path("site/publishing/doc-as-code-pilot/index.html")
          html = page.read_text(encoding="utf-8")
          downloads = (
              '<aside aria-label="Publication downloads"><strong>Downloads:</strong> '
              '<a href="../../downloads/doc-as-code/doc-as-code-pilot-001.html">HTML</a> · '
              '<a href="../../downloads/doc-as-code/doc-as-code-pilot-001.docx">Word</a> · '
              '<a href="../../downloads/doc-as-code/doc-as-code-pilot-001.pdf">PDF</a> · '
              '<a href="../../downloads/doc-as-code/requirements-index.json">Requirements</a> · '
              '<a href="../../downloads/doc-as-code/publication-provenance.json">Provenance</a></aside>'
          )
          if "</body>" not in html:
              raise SystemExit("Could not attach publication downloads to the pilot page")
          page.write_text(html.replace("</body>", downloads + "</body>"), encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
