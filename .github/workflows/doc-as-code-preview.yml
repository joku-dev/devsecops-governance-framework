name: Doc-as-Code Publication Preview

on:
  pull_request:
    paths:
      - "docs/publishing/doc-as-code-pilot.md"
      - "doc-as-code/**"
      - "requirements-validation.lock"
      - ".github/workflows/doc-as-code-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-publication:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install locked Python validation dependencies
        run: python -m pip install --require-hashes -r requirements-validation.lock

      - name: Build publication exports
        uses: ./doc-as-code

      - name: Upload reviewable publication files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doc-as-code-pilot-${{ github.sha }}
          path: build/doc-as-code/
          if-no-files-found: error
          retention-days: 14
