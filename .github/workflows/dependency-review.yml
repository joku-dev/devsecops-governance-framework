name: Dependency Review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref for a reviewed automation branch.
        required: false
        default: main
        type: string
      head_ref:
        description: Head ref; defaults to the dispatched branch.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          base-ref: ${{ github.event.pull_request.base.sha || inputs.base_ref || 'main' }}
          head-ref: ${{ github.event.pull_request.head.sha || inputs.head_ref || github.sha }}
