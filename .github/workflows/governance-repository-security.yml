name: Governance Repository Self-Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Preserve main and manual observations; cancel only obsolete PR revisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  governance-repository-security:
    name: Governance Repository Security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt

      - name: Assess live repository security posture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/assess_governance_repository_security.py
          cat generated/reports/governance-repository-security.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload self-security assessment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: governance-repository-security
          path: |
            generated/reports/governance-repository-security.json
            generated/reports/governance-repository-security.md
