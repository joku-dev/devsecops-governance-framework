name: Agent Review Status

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  report-review-metadata:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out trusted base implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install base validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Explain first installation
        if: hashFiles('scripts/report_agent_review_status.py') == ''
        run: echo 'Agent review status is report-only. The reporter is not installed on the trusted base yet; no PR code is executed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch PR objects without running PR code
        if: hashFiles('scripts/report_agent_review_status.py') != ''
        env:
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$REVIEW_PR_NUMBER" in ''|*[!0-9]*) exit 2 ;; esac
          git fetch --no-tags origin "+refs/pull/$REVIEW_PR_NUMBER/head:refs/remotes/review/pr-head"
      - name: Report review metadata
        if: hashFiles('scripts/report_agent_review_status.py') != ''
        run: |
          python scripts/report_agent_review_status.py \
            --event-file "$GITHUB_EVENT_PATH" \
            --output-json "$RUNNER_TEMP/agent-review-status.json" \
            --output-md "$RUNNER_TEMP/agent-review-status.md"
          cat "$RUNNER_TEMP/agent-review-status.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain report-only metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-review-status
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/agent-review-status.json
            ${{ runner.temp }}/agent-review-status.md
