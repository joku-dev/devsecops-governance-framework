name: Consumer Lifecycle Update

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Consumer operating acceptance or personally authorized operation
        required: true
        type: choice
        options: [acceptance, observe, action, refresh]
      source_run_id:
        description: Demo-consumer architecture mainline run, first attempt
        required: false
        type: string
      request_path:
        description: Committed model/governance/lifecycle/consumer-operation/action-requests JSON for action
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: consumer-lifecycle-update
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Bootstrap pinned validation
        run: |
          ./scripts/bootstrap_validation_env.sh
          echo "$PWD/.venv-validation/bin" >> "$GITHUB_PATH"
      - name: Prepare pilot update
        env:
          GH_TOKEN: ${{ secrets.GH_RESULT_INTAKE_TOKEN || github.token }}
          PILOT_OPERATION: ${{ inputs.operation }}
          PILOT_RUN_ID: ${{ inputs.source_run_id }}
          PILOT_REQUEST_PATH: ${{ inputs.request_path }}
        run: .venv-validation/bin/python scripts/run_consumer_lifecycle.py --operation "$PILOT_OPERATION" --source-run-id "$PILOT_RUN_ID" --request-path "$PILOT_REQUEST_PATH"
      - name: Validate pilot update
        run: ./scripts/validate_all.sh
      - name: Open operational review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv-validation/bin/python scripts/publish_consumer_lifecycle.py
