name: Build Doc-as-Code Publication
description: Install the pinned publication toolchain and build the manifest-controlled pilot.

runs:
  using: composite
  steps:
    - name: Install verified Pandoc release
      shell: bash
      run: |
        source doc-as-code/toolchain.env
        archive_path="$RUNNER_TEMP/$PANDOC_ARCHIVE_NAME"
        curl --fail --location --silent --show-error \
          "$PANDOC_ARCHIVE_URL" --output "$archive_path"
        echo "$PANDOC_ARCHIVE_SHA256  $archive_path" | sha256sum --check --status
        install_root="$RUNNER_TEMP/pandoc-$PANDOC_VERSION"
        mkdir -p "$install_root"
        tar -xzf "$archive_path" -C "$install_root" --strip-components=1
        echo "$install_root/bin" >> "$GITHUB_PATH"

    - name: Install configured PDF engine and fonts
      shell: bash
      run: |
        source doc-as-code/toolchain.env
        read -r -a pdf_packages <<< "$PDF_PACKAGES"
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y "${pdf_packages[@]}"

    - name: Build exports and provenance
      shell: bash
      run: |
        source doc-as-code/toolchain.env
        python3 doc-as-code/scripts/build_publication.py \
          --pandoc-archive "$RUNNER_TEMP/$PANDOC_ARCHIVE_NAME"
